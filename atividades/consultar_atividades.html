<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Atividades - APPCovao</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container container-large" style="text-align: left;">
        <h2>📋 Consultar Atividades da Escola</h2>
        <p>Aqui podes ver todas as atividades registadas. Podes editar ou apagar apenas aquelas que criaste.</p>

        <table>
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Aluno / Turma</th>
                    <th>Descrição</th>
                    <th>Criado por</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaAtividades">
                <tr><td colspan="5" style="text-align:center;">A carregar...</td></tr>
            </tbody>
        </table>

        <a href="../menu.html" class="back-link">← Voltar ao Menu Principal</a>
    </div>

    <!-- Modal simples de Edição -->
    <div id="editModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center;">
        <div style="background:white; padding:30px; border-radius:12px; width:100%; max-width:500px;">
            <h3>Editar Atividade</h3>
            <form onsubmit="guardarEdicao(event)">
                <input type="hidden" id="editIndex">
                <div class="form-group">
                    <label>Data</label>
                    <input type="date" id="editData" required>
                </div>
                <div class="form-group">
                    <label>Aluno / Turma</label>
                    <input type="text" id="editAluno" required>
                </div>
                <div class="form-group">
                    <label>Descrição</label>
                    <textarea id="editDescricao" rows="4" required></textarea>
                </div>
                <button type="submit">Guardar Alterações</button>
                <button type="button" onclick="fecharModal()" class="btn-secondary" style="margin-top:10px;">Cancelar</button>
            </form>
        </div>
    </div>

    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));

        window.onload = function() {
            if (!currentUser) {
                window.location.href = '../index.html';
                return;
            }
            carregarAtividades();
        };

        function carregarAtividades() {
            const tbody = document.getElementById('tabelaAtividades');
            let lista = JSON.parse(localStorage.getItem('atividades')) || [];

            if (lista.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Sem atividades registadas.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            lista.forEach((item, index) => {
                // Verifica se o utilizador atual é o criador ou se é administrador
                const isOwner = currentUser.email === item.criador || currentUser.role === 'admin';
                
                let acoesHtml = `<span style="color:var(--text-muted); font-size:12px;">Apenas leitura</span>`;
                
                if (isOwner) {
                    acoesHtml = `
                        <button onclick="abrirEdicao(${index})" class="btn-secondary" style="padding:4px 8px; font-size:12px; width:auto; margin-right:4px;">Editar</button>
                        <button onclick="apagarAtividade(${index})" class="btn-danger" style="padding:4px 8px; font-size:12px; width:auto;">Apagar</button>
                    `;
                }

                tbody.innerHTML += `
                    <tr>
                        <td>${item.data}</td>
                        <td>${item.aluno}</td>
                        <td>${item.descricao}</td>
                        <td><small style="color:var(--text-muted);">${item.criador || 'Desconhecido'}</small></td>
                        <td>${acoesHtml}</td>
                    </tr>
                `;
            });
        }

        function apagarAtividade(index) {
            if (confirm('Tem a certeza que pretende apagar esta atividade?')) {
                let lista = JSON.parse(localStorage.getItem('atividades')) || [];
                lista.splice(index, 1);
                localStorage.setItem('atividades', JSON.stringify(lista));
                carregarAtividades();
            }
        }

        function abrirEdicao(index) {
            let lista = JSON.parse(localStorage.getItem('atividades')) || [];
            const item = lista[index];

            document.getElementById('editIndex').value = index;
            document.getElementById('editData').value = item.data;
            document.getElementById('editAluno').value = item.aluno;
            document.getElementById('editDescricao').value = item.descricao;

            document.getElementById('editModal').style.display = 'flex';
        }

        function fecharModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        function guardarEdicao(e) {
            e.preventDefault();
            const index = document.getElementById('editIndex').value;
            
            let lista = JSON.parse(localStorage.getItem('atividades')) || [];
            
            lista[index].data = document.getElementById('editData').value;
            lista[index].aluno = document.getElementById('editAluno').value;
            lista[index].descricao = document.getElementById('editDescricao').value;

            localStorage.setItem('atividades', JSON.stringify(lista));
            fecharModal();
            carregarAtividades();
            alert('Atividade atualizada com sucesso!');
        }
    </script>
</body>
</html>
