<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Atividade - Registos Covão</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Estilos para Modais Personalizados */
        .custom-modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
        }

        .custom-modal {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            text-align: center;
            animation: modalFadeIn 0.3s ease;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .custom-modal h3 {
            color: var(--color-primary);
            margin-bottom: 0.5rem;
        }

        .custom-modal p {
            color: var(--text-light);
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .btn-modal {
            padding: 0.75rem 1.25rem;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            background-color: var(--color-primary);
            color: white;
            width: 100%;
        }

        .btn-modal:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="brand">
            <img src="imagens/logo.png" alt="Logo" onerror="this.style.display='none'">
            <span>Registos Covão</span>
        </div>
        <div class="user-info">
            <span>Olá, <strong id="userNameSpan"></strong></span>
            <a href="atividades.html" style="color: white; text-decoration: none; font-weight: 600;">⬅️ Voltar</a>
        </div>
    </div>

    <div class="container auth-wrapper" style="min-height: auto; padding: 2rem 1rem;">
        <div class="auth-card" style="max-width: 600px;">
            <h2 style="color: var(--color-primary); margin-bottom: 1.5rem; text-align: center;">Registar Nova Atividade</h2>
            
            <form id="novaAtividadeForm">
                <div class="form-group">
                    <label for="numAtividade">Número da Atividade</label>
                    <input type="text" id="numAtividade" readonly style="background-color: #f8fafc; cursor: not-allowed; font-weight: bold; color: var(--color-primary);">
                </div>

                <div class="form-group">
                    <label for="nomeAtividade">Nome da Atividade</label>
                    <input type="text" id="nomeAtividade" required placeholder="Insira o nome da atividade">
                </div>

                <div class="form-group">
                    <label for="anoLetivo">Ano Letivo</label>
                    <select id="anoLetivo" required>
                        <option value="" disabled selected>Selecione o ano letivo</option>
                        <option value="2023/2024">2023/2024</option>
                        <option value="2024/2025">2024/2025</option>
                        <option value="2025/2026">2025/2026</option>
                        <option value="2026/2027">2026/2027</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="tipoAtividade">Tipo de Atividade</label>
                    <select id="tipoAtividade" required>
                        <option value="" disabled selected>Selecione o tipo de atividade</option>
                        <option value="Atividade">Atividade</option>
                        <option value="Projeto">Projeto</option>
                        <option value="Formação/acção">Formação/acção</option>
                        <option value="Visita de Estudo">Visita de Estudo</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="criadoPor">Criado por</label>
                    <input type="text" id="criadoPor" readonly style="background-color: #f8fafc; cursor: not-allowed;">
                </div>

                <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">Guardar Atividade</button>
            </form>
        </div>
    </div>

    <!-- MODAL PERSONALIZADO DE SUCESSO -->
    <div id="successModal" class="custom-modal-overlay">
        <div class="custom-modal">
            <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🎉</div>
            <h3>Atividade Criada!</h3>
            <p id="successMessage">A atividade foi registada com sucesso.</p>
            <button type="button" class="btn-modal" onclick="fecharModalSucesso()">OK</button>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        // Verificar autenticação
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if(!currentUser) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('userNameSpan').innerText = currentUser.name || 'Utilizador';
            document.getElementById('criadoPor').value = currentUser.name || 'Utilizador';
        }

        // Atribuir automaticamente o Número da Atividade seguinte com segurança
        function definirNumeroAutomatico() {
            try {
                const atividades = JSON.parse(localStorage.getItem('atividades')) || [];
                const proximoNumero = atividades.length + 1;
                const inputNum = document.getElementById('numAtividade');
                if (inputNum) {
                    inputNum.value = proximoNumero;
                }
            } catch (error) {
                console.error("Erro ao carregar número automático:", error);
                document.getElementById('numAtividade').value = 1;
            }
        }

        // Executar imediatamente ao carregar o script
        definirNumeroAutomatico();

        // Lógica de submissão do formulário
        const form = document.getElementById('novaAtividadeForm');
        if (form) {
            form.addEventListener('submit', function(e) {
                e.preventDefault(); // Impede o recarregamento imediato

                let atividades = [];
                try {
                    atividades = JSON.parse(localStorage.getItem('atividades')) || [];
                } catch (err) {
                    atividades = [];
                }

                const proximoNumero = atividades.length + 1;

                const novaAtividade = {
                    id: Date.now(),
                    numero: proximoNumero,
                    titulo: document.getElementById('nomeAtividade').value.trim(),
                    anoLetivo: document.getElementById('anoLetivo').value,
                    tipo: document.getElementById('tipoAtividade').value,
                    criadorId: currentUser.id || '',
                    criadorNome: currentUser.name || '',
                    data: new Date().toISOString().split('T')[0]
                };
                
                atividades.push(novaAtividade);
                localStorage.setItem('atividades', JSON.stringify(atividades));

                // Atualizar o texto do modal e exibi-lo corretamente via flex
                const msgElement = document.getElementById('successMessage');
                const modalElement = document.getElementById('successModal');
                
                if (msgElement) {
                    msgElement.innerText = `Atividade #${proximoNumero} criada com sucesso!`;
                }
                if (modalElement) {
                    modalElement.style.display = 'flex';
                }
            });
        }

        function fecharModalSucesso() {
            const modalElement = document.getElementById('successModal');
            if (modalElement) {
                modalElement.style.display = 'none';
            }
            window.location.href = 'atividades.html';
        }
    </script>
</body>
</html>
