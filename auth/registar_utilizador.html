<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registo - APPCovao</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <img src="../imagens/logo.png" alt="Logótipo" class="auth-logo" onerror="this.style.display='none'">
        <h2>Criar Nova Conta</h2>
        <p>Apenas são aceites emails institucionais <code>@edu.madeira.gov.pt</code>.</p>

        <form onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>Nome Completo</label>
                <input type="text" id="regName" required>
            </div>
            <div class="form-group">
                <label>Email Institucional</label>
                <input type="email" id="regEmail" placeholder="nome@edu.madeira.gov.pt" required>
            </div>
            <div class="form-group">
                <label>Palavra-passe</label>
                <input type="password" id="regPassword" required>
            </div>
            <button type="submit">Submeter Registo</button>
        </form>

        <a href="../index.html" class="back-link">← Voltar ao Login</a>
    </div>

    <script>
        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;

            if (!email.endsWith('@edu.madeira.gov.pt')) {
                alert('Erro: Apenas são permitidos emails terminados em @edu.madeira.gov.pt');
                return;
            }

            let users = JSON.parse(localStorage.getItem('users')) || [];
            if (users.some(u => u.email === email)) {
                alert('Este email já se encontra registado.');
                return;
            }

            users.push({ name, email, password, role: 'user', approved: false });
            localStorage.setItem('users', JSON.stringify(users));

            alert('Registo submetido com sucesso! A conta está pendente de aprovação.');
            window.location.href = '../index.html';
        }
    </script>
</body>
</html>
