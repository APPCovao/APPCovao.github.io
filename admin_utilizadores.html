<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Utilizadores - APPCovao</title>
</head>
<body>
    <h2>Painel de Administração - Gestão de Utilizadores</h2>
    <p>Aqui podes aceitar novos registos, apagar utilizadores ou promover membros a administradores.</p>

    <table border="1" width="100%" cellpadding="8">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Email</th>
                <th>Estado</th>
                <th>Cargo / Papel</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="usersTableBody">
            <!-- Exemplo simulado de dados -->
            <tr>
                <td>Professor Exemplo</td>
                <td>prof.exemplo@edu.madeira.gov.pt</td>
                <td><span style="color: orange; font-weight: bold;">Pendente</span></td>
                <td>Professor</td>
                <td>
                    <button onclick="aprovarUtilizador(this)">Aceitar</button>
                    <button onclick="tornarAdmin(this)">Tornar Admin</button>
                    <button onclick="apagarUtilizador(this)" style="color: red;">Apagar</button>
                </td>
            </tr>
        </tbody>
    </table>

    <br>
    <p><a href="menu.html">← Voltar ao Menu Principal</a></p>

    <script>
        function aprovarUtilizador(btn) {
            alert('Utilizador aceite com sucesso!');
            const row = btn.closest('tr');
            row.cells[2].innerHTML = '<span style="color: green; font-weight: bold;">Aprovado</span>';
            btn.remove(); // Remove o botão de aceitar após aprovado
        }

        function tornarAdmin(btn) {
            alert('Utilizador promovido a Administrador!');
            const row = btn.closest('tr');
            row.cells[3].textContent = 'Administrador';
        }

        function apagarUtilizador(btn) {
            if (confirm('Tem a certeza que pretende apagar este utilizador?')) {
                const row = btn.closest('tr');
                row.remove();
                alert('Utilizador apagado.');
            }
        }
    </script>
</body>
</html>
