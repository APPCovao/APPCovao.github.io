<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Utilizadores - APPCovao</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container container-large">
        <h2>👥 Painel de Administração - Utilizadores</h2>
        <p>Aprova contas pendentes, promove utilizadores a administradores ou remove acessos.</p>

        <table>
            <thead>
                <tr>
                    <th>Email</th>
                    <th>Papel</th>
                    <th>Estado</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaAdminUsers">
                <tr><td colspan="4" style="text-align:center;">A carregar...</td></tr>
            </tbody>
        </table>

        <a href="menu.html" class="back-link">← Voltar ao Menu Principal</a>
    </div>

    <script>
        function carregarUtilizadoresAdmin() {
            const tbody = document.getElementById('tabelaAdminUsers');
            const users = JSON.parse(localStorage.getItem('users')) || [];

            tbody.innerHTML = '';
            users.forEach((u, index) => {
                const badgeClass = u.approved ? 'badge-approved' : 'badge-pending';
                const estadoTexto = u.approved ? 'Aprovado' : 'Pendente';
                
                tbody.innerHTML += `
                    <tr>
                        <td>${u.email}</td>
                        <td>${u.role === 'admin' ? 'Administrador' : 'Professor'}</td>
                        <td><span class="badge ${badgeClass}">${estadoTexto}</span></td>
                        <td>
                            ${!u.approved ? `<button onclick="aprovar(${index})" style="background:var(--success); padding:4px 8px; font-size:12px; width:auto;">Aprovar</button>` : ''}
                            ${u.role !== 'admin' ? `<button onclick="tornarAdmin(${index})" style="background:#2980b9; padding:4px 8px; font-size:12px; width:auto; margin-left:4px;">Tornar Admin</button>` : ''}
                            <button onclick="apagar(${index})" class="btn-danger" style="padding:4px 8px; font-size:12px; width:auto; margin-left:4px;">Apagar</button>
                        </td>
                    </tr>
                `;
            });
        }

        function aprovar(index) {
            let users = JSON.parse(localStorage.getItem('users')) || [];
            users[index].approved = true;
            localStorage.setItem('users', JSON.stringify(users));
            carregarUtilizadoresAdmin();
        }

        function tornarAdmin(index) {
            let users = JSON.parse(localStorage.getItem('users')) || [];
            users[index].role = 'admin';
            localStorage.setItem('users', JSON.stringify(users));
            carregarUtilizadoresAdmin();
        }

        function apagar(index) {
            if (confirm('Pretende mesmo apagar este utilizador?')) {
                let users = JSON.parse(localStorage.getItem('users')) || [];
                users.splice(index, 1);
                localStorage.setItem('users', JSON.stringify(users));
                carregarUtilizadoresAdmin();
            }
        }

        window.onload = carregarUtilizadoresAdmin;
    </script>
</body>
</html>
