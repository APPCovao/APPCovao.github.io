<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registos Covão - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="navbar">
        <div class="brand">
            <img src="imagens/logo.png" alt="Logo" onerror="this.style.display='none'">
            <span>Registos Covão</span>
        </div>
    </div>

    <div class="container auth-wrapper">
        <!-- ECRÃ DE LOGIN -->
        <div id="loginScreen" class="auth-card">
            <h2 style="color: var(--color-primary); margin-bottom: 1.5rem; text-align: center;">Bem-vindo</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                   <input type="email" id="email" required placeholder="o.teu.email@exemplo.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="Sua password">
                </div>
                <button type="submit" class="btn btn-primary">ENTRAR</button>
            </form>
            <button id="showRegister" class="btn btn-secondary">Criar Nova Conta</button>
        </div>

        <!-- ECRÃ DE CRIAR CONTA -->
        <div id="registerScreen" class="auth-card" style="display: none;">
            <h2 style="color: var(--color-primary); margin-bottom: 1.5rem; text-align: center;">Criar Conta</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" required>
                </div>
                <button type="submit" class="btn btn-primary">CRIAR CONTA</button>
            </form>
            <button id="backToLogin" class="btn btn-secondary">Voltar ao Login</button>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
