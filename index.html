<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registos Covão - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="navbar">
        <div class="brand">
            <img src="imagens/logo.png" alt="Logo" onerror="this.style.display='none'">
            <span>Registos Covão</span>
        </div>
    </div>

    <div class="container auth-wrapper">
        <!-- ECRÃ DE LOGIN -->
        <div id="loginScreen" class="auth-card">
            <h2 style="color: var(--color-primary); margin-bottom: 1.5rem; text-align: center;">Bem-vindo</h2>
            <form id="loginForm" onsubmit="lidarComLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" required placeholder="o.teu.email@exemplo.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" required placeholder="Sua password">
                </div>
                <button type="submit" class="btn btn-primary">ENTRAR</button>
            </form>
            <button id="showRegister" class="btn btn-secondary" onclick="document.getElementById('loginScreen').style.display='none'; document.getElementById('registerScreen').style.display='block';">Criar Nova Conta</button>
        </div>

        <!-- ECRÃ DE CRIAR CONTA -->
        <div id="registerScreen" class="auth-card" style="display: none;">
            <h2 style="color: var(--color-primary); margin-bottom: 1.5rem; text-align: center;">Criar Conta</h2>
            <form id="registerForm" onsubmit="lidarComRegisto(event)">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="regNome" required placeholder="O teu nome completo">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" required placeholder="o.teu.email@exemplo.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" required placeholder="Sua password">
                </div>
                <button type="submit" class="btn btn-primary">CRIAR CONTA</button>
            </form>
            <button id="backToLogin" class="btn btn-secondary" onclick="document.getElementById('registerScreen').style.display='none'; document.getElementById('loginScreen').style.display='block';">Voltar ao Login</button>
        </div>
    </div>

    <!-- Scripts de Ligação ao Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
