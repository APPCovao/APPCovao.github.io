<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - APPCovao</title>
</head>
<body>
    <h2>APPCovao - Entrar</h2>
    <form onsubmit="handleLogin(event)">
        <div>
            <label>Email Institucional:</label><br>
            <input type="email" id="loginEmail" placeholder="nome@edu.madeira.gov.pt" required>
        </div>
        <br>
        <div>
            <label>Palavra-passe:</label><br>
            <input type="password" id="loginPassword" required>
        </div>
        <br>
        <button type="submit">Entrar</button>
    </form>
    <p>Não tens conta? <a href="register.html">Regista-te aqui</a></p>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            
            // Simulação de teste para o Admin de teste
            if (email === 'admin@edu.madeira.gov.pt') {
                localStorage.setItem('currentUser', JSON.stringify({ email: email, role: 'admin', approved: true }));
                window.location.href = 'menu.html';
                return;
            }

            // Para outros utilizadores simulados
            alert('Login efetuado com sucesso!');
            localStorage.setItem('currentUser', JSON.stringify({ email: email, role: 'user', approved: true }));
            window.location.href = 'menu.html';
        }
    </script>
</body>
</html>
