<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registo de Objetivos e Metas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { color: #2c3e50; margin-bottom: 5px; }
        .subtitle { color: #7f8c8d; font-size: 14px; margin-bottom: 25px; }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #34495e;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccd1d1;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:disabled, select:disabled, textarea:disabled {
            background-color: #eaeded;
            color: #7f8c8d;
            cursor: not-allowed;
        }
        textarea { resize: vertical; height: 100px; }
        .btn-container {
            text-align: right;
            margin-top: 30px;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background-color: #219653; }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="tituloPaginaHeader">Registo de Objetivos e Metas</h2>
        <p class="subtitle" id="subtituloPaginaHeader">Preencha os dados necessários.</p>

        <form id="formObjetivos">
            <div class="form-group">
                <label for="numeroAtividade">Número da Atividade:</label>
                <input type="text" id="numeroAtividade" name="numeroAtividade" required>
            </div>

            <!-- Objetivos e Metas visíveis diretamente, sem depender de nenhum PEE -->
            <div class="form-group" id="blocoObjetivosMetas">
                <label for="descricaoObjetivo">Objetivos e Metas:</label>
                <textarea id="descricaoObjetivo" name="descricaoObjetivo" placeholder="Insira os objetivos e metas..."></textarea>
            </div>

            <div class="form-group">
                <label for="observacoes">Observações:</label>
                <input type="text" id="observacoes" name="observacoes">
            </div>

            <div class="btn-container">
                <button type="submit" id="btnGuardar">Guardar</button>
            </div>
        </form>
    </div>

    <script>
        function carregarDadosAtividade(id) {
            const dadosSalvos = JSON.parse(localStorage.getItem('registosObjetivosAtividades')) || {};
            const dadosAtividade = dadosSalvos[id];

            if (dadosAtividade) {
                document.getElementById('descricaoObjetivo').value = dadosAtividade.objetivo || '';
                document.getElementById('observacoes').value = dadosAtividade.observacoes || '';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const numeroAtivUrl = urlParams.get('id') || urlParams.get('numero');
            const modoUrl = urlParams.get('modo'); // 'ver', 'editar' ou vazio (criar)

            if (numeroAtivUrl) {
                const inputNum = document.getElementById('numeroAtividade');
                inputNum.value = numeroAtivUrl;
                inputNum.readOnly = true; 
                setTimeout(() => {
                    carregarDadosAtividade(numeroAtivUrl);
                }, 50);
            }

            if (modoUrl === 'ver') {
                document.getElementById('tituloPaginaHeader').innerText = 'Visualizar Registo de Objetivos';
                document.getElementById('subtituloPaginaHeader').innerText = 'Modo de visualização.';
                document.getElementById('btnGuardar').style.display = 'none';
                
                setTimeout(() => {
                    document.querySelectorAll('input, textarea, select').forEach(el => {
                        el.disabled = true;
                    });
                }, 100);

            } else if (modoUrl === 'editar') {
                document.getElementById('tituloPaginaHeader').innerText = 'Editar Registo de Objetivos';
                document.getElementById('subtituloPaginaHeader').innerText = 'Altere os dados pretendidos.';
            }
        });

        document.getElementById('formObjetivos').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('numeroAtividade').value;
            const objetivo = document.getElementById('descricaoObjetivo').value;
            const observacoes = document.getElementById('observacoes').value;

            let dadosSalvos = JSON.parse(localStorage.getItem('registosObjetivosAtividades')) || {};
            dadosSalvos[id] = { objetivo, observacoes };
            
            localStorage.setItem('registosObjetivosAtividades', JSON.stringify(dadosSalvos));
            alert('Registo guardado com sucesso!');
        });
    </script>
</body>
</html>
