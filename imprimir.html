<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imprimir Registo de Turma</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #1f2937;
            margin: 0;
            padding: 30px;
            background-color: #ffffff;
        }
        .print-container {
            max-width: 800px;
            margin: 0 auto;
            border: 2px solid #15803d;
            border-radius: 12px;
            padding: 40px;
            position: relative;
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #bbf7d0;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #15803d;
            margin: 0 0 5px 0;
            font-size: 24px;
        }
        .header p {
            color: #4b5563;
            margin: 0;
            font-size: 14px;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            font-size: 15px;
        }
        .info-item {
            background-color: #f0fdf4;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #bbf7d0;
        }
        .info-item strong {
            color: #15803d;
            display: block;
            margin-bottom: 4px;
            font-size: 12px;
            text-transform: uppercase;
        }
        .footer-print {
            margin-top: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-imprimir {
            background-color: #15803d;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        @media print {
            .no-print {
                display: none;
            }
            body {
                padding: 0;
            }
            .print-container {
                border: none;
                padding: 0;
            }
        }
    </style>
</head>
<body>

    <div class="print-container">
        <div class="header">
            <h1>EB1/PE do Covão e Vargens</h1>
            <p>Relatório Estatístico de Aproveitamento por Turma</p>
        </div>

        <div class="info-grid">
            <div class="info-item">
                <strong>Turma</strong>
                <span id="printTurma">-</span>
            </div>
            <div class="info-item">
                <strong>Ano Letivo</strong>
                <span id="printAno">-</span>
            </div>
            <div class="info-item">
                <strong>Total de Alunos</strong>
                <span id="printTotalAlunos">-</span>
            </div>
            <div class="info-item">
                <strong>Data do Registo</strong>
                <span id="printData">-</span>
            </div>
            <div class="info-item">
                <strong>Português (Bom / Muito Bom)</strong>
                <span id="printPort">-</span>
            </div>
            <div class="info-item">
                <strong>Matemática (Bom / Muito Bom)</strong>
                <span id="printMat">-</span>
            </div>
        </div>

        <div style="text-align: right; font-size: 13px; color: #6b7280; margin-top: 20px;">
            Registado por: <span id="printUtilizador">-</span>
        </div>

        <div class="footer-print no-print">
            <a href="javascript:history.back()" style="color: #4b5563; text-decoration: none; font-weight: 600;">← Voltar</a>
            <button class="btn-imprimir" onclick="window.print()">Imprimir Página</button>
        </div>
    </div>

    <script>
        // Obter o índice ou ID enviado pelo URL (ex: imprimir.html?id=0)
        const urlParams = new URLSearchParams(window.location.search);
        const index = urlParams.get('id');

        const turmas = JSON.parse(localStorage.getItem('turmas')) || [];
        const t = turmas[index];

        if (t) {
            document.getElementById('printTurma').innerText = t.nomeTurma;
            document.getElementById('printAno').innerText = t.anoLetivo;
            document.getElementById('printTotalAlunos').innerText = t.totalAlunos + ' alunos';
            document.getElementById('printData').innerText = t.dataRegisto || 'N/D';
            document.getElementById('printPort').innerText = `${t.bonsPort} alunos (${t.percPort})`;
            document.getElementById('printMat').innerText = `${t.bonsMat} alunos (${t.percMat})`;
            document.getElementById('printUtilizador').innerText = t.registadoPor || 'Sistema';
        } else {
            alert('Registo não encontrado.');
        }
    </script>
</body>
</html>
