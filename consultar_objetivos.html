<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Objetivos - APPCovao</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container container-large">
        <h2>📋 Consultar Objetivos e Metas</h2>
        <p>Lista de todos os objetivos pedagógicos registados.</p>

        <table>
            <thead>
                <tr>
                    <th>Aluno</th>
                    <th>Objetivo / Meta</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody id="tabelaObjetivos">
                <tr><td colspan="3" style="text-align:center;">A carregar...</td></tr>
            </tbody>
        </table>

        <a href="menu.html" class="back-link">← Voltar ao Menu Principal</a>
    </div>

    <script>
        function carregarObjetivos() {
            const tbody = document.getElementById('tabelaObjetivos');
            const objetivos = JSON.parse(localStorage.getItem('objetivos')) || [];

            if (objetivos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;">Sem objetivos registados. Podes criar um na página de Objetivos.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            objetivos.forEach(item => {
                const badgeClass = item.estado === 'Atingido' ? 'badge-approved' : 'badge-pending';
                tbody.innerHTML += `
                    <tr>
                        <td>${item.aluno}</td>
                        <td>${item.texto}</td>
                        <td><span class="badge ${badgeClass}">${item.estado}</span></td>
                    </tr>
                `;
            });
        }

        window.onload = carregarObjetivos;
    </script>
</body>
</html>
